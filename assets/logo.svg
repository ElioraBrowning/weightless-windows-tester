<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Monitor frame with ~10% outer margin -->
  <rect x="14" y="20" width="100" height="70" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="5"/>
  <!-- Coordinate grid lines inside monitor -->
  <line x1="47" y1="24" x2="47" y2="86" stroke="#F87171" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="81" y1="24" x2="81" y2="86" stroke="#F87171" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="18" y1="43" x2="110" y2="43" stroke="#F87171" stroke-width="2" stroke-opacity="0.7"/>
  <line x1="18" y1="67" x2="110" y2="67" stroke="#F87171" stroke-width="2" stroke-opacity="0.7"/>
  <!-- Target OCR bounding reticle -->
  <rect x="38" y="36" width="38" height="22" rx="3" stroke="#4ADE80" stroke-width="3" fill="#4ADE80" fill-opacity="0.15"/>
  <!-- Monitor stand -->
  <line x1="64" y1="90" x2="64" y2="104" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <line x1="42" y1="106" x2="86" y2="106" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <!-- Cursor arrow targeting the reticle -->
  <path d="M68 52 L92 64 L80 68 L86 80 L80 83 L74 71 L66 78 Z" fill="#FACC15" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
